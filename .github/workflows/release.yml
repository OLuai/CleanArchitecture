name: Release

# Publishing a GitHub release tagged vX.Y.Z packs the template as
# OLuai.CleanArchitecture.Template X.Y.Z and pushes it to this account's GitHub Packages feed.
# Install it on another machine with:
#   dotnet nuget add source https://nuget.pkg.github.com/OLuai/index.json -n github-oluai -u OLuai -p <PAT with read:packages>
#   dotnet new install OLuai.CleanArchitecture.Template

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish to GitHub Packages

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        name: Checkout

      - name: Install .NET
        uses: actions/setup-dotnet@v6

      - name: Extract version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Update nuspec release notes
        env:
          RELEASE_NOTES: ${{ github.event.release.body }}
        run: |
          python3 - <<'EOF'
          import os, xml.etree.ElementTree as ET
          ET.register_namespace('', 'http://schemas.microsoft.com/packaging/2012/06/nuspec.xsd')
          tree = ET.parse('CleanArchitecture.nuspec')
          root = tree.getroot()
          ns = {'n': 'http://schemas.microsoft.com/packaging/2012/06/nuspec.xsd'}
          root.find('.//n:releaseNotes', ns).text = os.environ.get('RELEASE_NOTES', '')
          tree.write('CleanArchitecture.nuspec', xml_declaration=True, encoding='utf-8')
          EOF

      - name: Pack
        run: dotnet pack build/Template.csproj -p:PackageVersion=${{ steps.version.outputs.value }} -o artifacts/packages

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: artifacts/packages/*.nupkg

      - name: Publish
        run: >
          dotnet nuget push artifacts/packages/*.nupkg
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate
